version: "3.8"

services:
    db:
        image: postgres:16-alpine
        container_name: bukutamu_db
        restart: unless-stopped
        environment:
            POSTGRES_DB: bukutamu_ptsa
            POSTGRES_USER: binsis
            POSTGRES_PASSWORD: password123
        ports:
            - "5433:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data

volumes:
    postgres_data:
